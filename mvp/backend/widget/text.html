<!-- Voice Assistant Widget: sandbox -->
<script>
(function() {
    // API base URL for widget backend connection
    let apiBaseUrl = 'http://localhost:8081';
    
    // Create and load widget script-
    const script = document.createElement('script');
    script.src = apiBaseUrl.replace(/\/$/, '') + '/api/widget/widget.js';
    script.setAttribute('data-agent-id', '15');
    script.setAttribute('data-api-url', apiBaseUrl);
    script.setAttribute('data-agent-name', 'sandbox');
    script.async = true;
    
    document.head.appendChild(script);
})();
</script>
